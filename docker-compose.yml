version: "3.9"

services:
  llm-service:
    image: ollama/ollama:latest          # always pin a tag you trust in prod
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"        # share the same GPU
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Optional: limit Ollama’s GPU memory footprint
      # OLLAMA_MAX_GPU_MEMORY: "20GiB"     # tweak for your card
    volumes:
      - ollama:/root/.ollama
    expose:
      - "11434"
    networks: [app-net]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull llama3 && wait"]

  image-generator:
    build:
      context: .
      dockerfile: ./image-generator/Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Optional PyTorch memory tuner
      # PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
    expose:
      - "5001"
    networks: [app-net]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  poster-service:
    build:
      context: .
      dockerfile: ./poster-service/Dockerfile
    networks: [app-net]
    expose:
      - "5002"

  video-generator:
    build:
      context: .
      dockerfile: ./video-generator/Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
      # HF token loaded from .env file
      HF_TOKEN: ${HF_TOKEN}
    networks: [app-net]
    expose:
      - "5003"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  asin-extractor:
    build:
      context: .
      dockerfile: ./asin-extractor/Dockerfile
    networks: [app-net]
    expose:
      - "5004"
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    depends_on:
      - llm-service
      - image-generator
      - poster-service
      - video-generator
      # - asin-extractor  # Not needed for Option 2 (manual product input)
    networks: [app-net]
    ports:
      - "8000:8000"

volumes:
  ollama:

networks:
  app-net:

